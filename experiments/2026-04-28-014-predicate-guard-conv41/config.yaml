experiment:
  id: "2026-04-28-014"
  name: "predicate-guard-conv41"
  description: "Relate 示例补全 predicate，并在写边前拒绝 related/非法 family-predicate；conv-41 建图验证"
  branch: "fact-first-construction"
  commit: "d54912e+worktree"
  based_on: "2026-04-28-013"

data_path: data/locomo/locomo10.json
dataset_name: locomo
sample_ids: [conv-41]

build:
  from_scratch: true
  k_turns: 999

graph:
  seed_top_k: 5
  max_hops: 2
